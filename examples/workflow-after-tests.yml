# Same workflow as the tests, so the comment sees finished job logs.
# if: always() still posts the comment when the test job fails.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test

  evidence:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: your-org/pr-evidence-check@v0.1.0
