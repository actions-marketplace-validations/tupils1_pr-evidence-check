# Same workflow as the tests, so the comment sees finished job logs.
# if: always() still posts the comment when the test job fails.
# The test job only needs contents: read. Job permissions replace the
# workflow permissions, so the evidence job repeats the full minimum set.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm test

  evidence:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
      actions: read
    steps:
      - uses: tupils1/pr-evidence-check@v1
